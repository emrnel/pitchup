name: pitchup_app
description: PitchUp - Yatirimci ve Girisimcileri Bulusturan Platform
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0" # <-- SDK sürümünü Dart 3'e yükselt

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # Firebase (Tüm sürümleri 'any' olarak ayarla veya en son sürümleri yaz)
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  firebase_messaging: any
  firebase_analytics: any
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  # go_router: ^12.1.3 # go_router'ı şimdilik devre dışı bırak, Firebase güncellemesinden sonra bakarız
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # Video
  video_player: ^2.8.1
  video_compress: ^3.1.2
  
  # Image
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  image_picker: ^1.0.4
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Utils
  intl: 0.19.0 # <-- Bunu 'any' yap
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  
  # Animations
  shimmer: ^3.0.0
  lottie: ^2.7.0
  google_sign_in: any # <-- 'any' olarak ayarla
  sign_in_with_apple: any # <-- 'any' olarak ayarla
  flutter_local_notifications: any # <-- 'any' olarak ayarla

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700